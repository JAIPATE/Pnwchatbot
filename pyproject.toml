[project]
name = "pnw-knowledge-chatbot"
version = "0.1.0"
description = "Purdue University Northwest (PNW) Knowledge Chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.21.2",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.1",
    "numpy>=2.4.6",
    "fastembed>=0.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
